<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/call.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/mascot.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/voice.css">
<link rel="stylesheet" href="css/presence.css">
<link rel="stylesheet" href="css/hover.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/reduced-motion.css">
</head>
<body data-pane="canais">
<div id="bunny" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <g transform="rotate(-9 34 24)"><ellipse cx="34" cy="24" rx="10" ry="22" fill="#ececee"/><ellipse cx="34" cy="26" rx="5" ry="16" fill="#f0b98a"/></g>
    <g transform="rotate(9 66 24)"><ellipse cx="66" cy="24" rx="10" ry="22" fill="#ececee"/><ellipse cx="66" cy="26" rx="5" ry="16" fill="#f0b98a"/></g>
    <ellipse cx="50" cy="63" rx="35" ry="30" fill="#f1f1f3"/>
    <circle cx="23" cy="72" r="5.5" fill="#e8a36a" opacity=".7"/><circle cx="77" cy="72" r="5.5" fill="#e8a36a" opacity=".7"/>
    <g><path d="M69 36 60 29.5v13Z M69 36 78 29.5v13Z" fill="#e8893a"/><circle cx="69" cy="36" r="2.6" fill="#f6b57a"/></g>
    <g>
      <circle class="sclera" cx="36" cy="60" r="9.5" fill="#fff"/>
      <g class="iris"><circle cx="36" cy="60" r="5.2" fill="#8a5a2b"/><circle cx="36" cy="60" r="5.2" fill="none" stroke="#5a3714" stroke-width="1"/><circle cx="36" cy="60" r="2.4" fill="#1a0e05"/><circle cx="34.3" cy="58.3" r="1.2" fill="#fff"/></g>
    </g>
    <g>
      <circle class="sclera" cx="64" cy="60" r="9.5" fill="#fff"/>
      <g class="iris"><circle cx="64" cy="60" r="5.2" fill="#8a5a2b"/><circle cx="64" cy="60" r="5.2" fill="none" stroke="#5a3714" stroke-width="1"/><circle cx="64" cy="60" r="2.4" fill="#1a0e05"/><circle cx="62.3" cy="58.3" r="1.2" fill="#fff"/></g>
    </g>
    <g fill="rgba(255,255,255,.08)" stroke="#1c1c1f" stroke-width="2.6">
      <circle cx="36" cy="60" r="13.5"/><circle cx="64" cy="60" r="13.5"/>
    </g>
    <path d="M49.5 59.5h1" stroke="#1c1c1f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M22.5 59 15 56M77.5 59 85 56" stroke="#1c1c1f" stroke-width="2.4" stroke-linecap="round"/>
    <g fill="none" stroke="#141416" stroke-linecap="round">
      <path d="M26.3 58.5A9.8 9.8 0 0 1 45.7 58.5M54.3 58.5A9.8 9.8 0 0 1 73.7 58.5" stroke-width="2.2"/>
      <path d="M27.3 57.7 20.1 55.7M29.1 54.2 23.4 49.4M32.2 51.8 29 45M36 51 36 44.5" stroke-width="2"/>
      <path d="M72.7 57.7 79.9 55.7M70.9 54.2 76.6 49.4M67.8 51.8 71 45M64 51 64 44.5" stroke-width="2"/>
    </g>
    <ellipse cx="50" cy="75" rx="3.2" ry="2.4" fill="#d98a5a"/>
    <path d="M50 77.4v3M50 80.4q-3.5 3.2-7 .6M50 80.4q3.5 3.2 7 .6" fill="none" stroke="#6b6b72" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</div>
<aside>
  <div class="brand"><div class="logo" id="logo"></div><span>Chamada</span></div>
  <div class="sec"><span>Canais de voz</span><button id="newch" class="icon-btn" title="Novo canal de voz" aria-label="Novo canal de voz"></button></div>
  <div id="channels"></div>
  <div class="sec"><span id="ptitle">Online</span></div>
  <div id="people"></div>
  <div id="me" class="me"></div>
</aside>

<main>
  <canvas id="flow" aria-hidden="true"></canvas>
  <div class="top"><strong id="title">Chamada</strong><span id="sub"></span></div>
  <div id="stage">
    <div id="empty"><div class="ring" id="ering"></div><h2 id="et"></h2><p id="ed"></p></div>
  </div>
  <div id="bar" hidden>
    <div class="pill">
      <button class="cb" id="mic"></button>
      <button class="cb" id="deaf"></button>
      <button class="cb" id="share"></button>
      <select class="cb" id="q" title="Qualidade do compartilhamento de tela" aria-label="Qualidade do compartilhamento de tela">
        <option value="720-30">720p · 30 fps</option>
        <option value="720-60">720p · 60 fps</option>
        <option value="1080-30">1080p · 30 fps</option>
        <option value="1080-60">1080p · 60 fps</option>
      </select>
      <button class="cb leave" id="leave"></button>
    </div>
  </div>
</main>

<section id="chat">
  <div class="top"><strong>Chat</strong><span id="chsub">Entre em um canal para conversar</span></div>
  <div id="msgs"></div>
  <div id="typing" aria-live="polite"></div>
  <div id="composer"><input id="txt" placeholder="Entre em um canal para conversar" maxlength="1000" autocomplete="off" aria-label="Mensagem" disabled><button class="send" id="send" aria-label="Enviar mensagem" disabled></button></div>
</section>

<nav class="tabs" aria-label="Seções"><button data-p="canais" id="tb-canais"></button><button data-p="call" id="tb-call"></button><button data-p="chat" id="tb-chat"></button></nav>

<script src="/socket.io/socket.io.js"></script>
<script src="js/background-flow.js"></script>
<script src="js/helpers.js"></script>
<script src="js/connection.js"></script>
<script src="js/state.js"></script>
<script src="js/speaking.js"></script>
<script src="js/sounds.js"></script>
<script src="js/volume.js"></script>
<script src="js/presence.js"></script>
<script src="js/ping.js"></script>
<script src="js/typing.js"></script>
<script src="js/ui.js"></script>
<script src="js/chat.js"></script>
<script src="js/call.js"></script>
<script src="js/webrtc.js"></script>
<script src="js/fullscreen.js"></script>
<script src="js/controls.js"></script>
<script src="js/screen-share.js"></script>
<script src="js/diagnostics.js"></script>
<script src="js/mascot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
